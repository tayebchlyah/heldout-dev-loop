name: Impact map

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: impact-map
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEVLOOP_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Playwright and Chromium
        run: npm ci && npx playwright install --with-deps chromium

      - name: Install git-cliff
        run: |
          curl -fsSL -o git-cliff.tar.gz https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          echo "24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4  git-cliff.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf git-cliff.tar.gz --strip-components=1 -C "$HOME/.local/bin" git-cliff-2.14.2/git-cliff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Trace the suites
        run: python3 scripts/impact_map.py trace --jobs 4

      - name: Push the new map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- tests/impact-map.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/impact-map
          git add tests/impact-map.json
          git commit -m "🔧(tests) #327: Refresh the impact map"
          git push --force origin chore/impact-map
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...chore/impact-map?expand=1"
          issue=$(gh issue list --state open --search 'in:title "Impact map refresh"' --json number,title --jq 'map(select(.title == "Impact map refresh"))[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "The impact map changed. Open the PR: $link"
          else
            gh issue create --title "Impact map refresh" --body "The impact map changed. Open the PR: $link"
          fi
