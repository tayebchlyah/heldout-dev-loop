name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag version $tag_version does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Check the kit source of the release candidate
        if: ${{ !contains(github.ref_name, '-rc.') }}
        run: python3 scripts/repo_rules.py promoted --tag "$GITHUB_REF_NAME"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Write the release notes
        run: python3 .agents/skills/dev-loop/scripts/devloop.py release-notes --tag "$GITHUB_REF_NAME" --output CHANGES.md

      - name: Create or update release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          bodyFile: CHANGES.md
          tag: ${{ github.ref_name }}
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          makeLatest: ${{ !contains(github.ref_name, '-rc.') }}
