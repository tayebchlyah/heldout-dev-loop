name: Mutation canary

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - skill/scripts/mutation/**
      - tests/fixtures/mutation/**
      - scripts/mutation_canary.sh
      - .github/workflows/mutation-canary.yml
      - skill/scripts/devloop.py

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [mutmut, stryker, mutago]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - if: matrix.adapter == 'mutmut'
        run: python3 -m pip install mutmut==3.8.1 pytest==9.2.0
      - if: matrix.adapter == 'stryker'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: matrix.adapter == 'mutago'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: scripts/mutation_canary.sh tests/fixtures/mutation/${{ matrix.adapter }}
