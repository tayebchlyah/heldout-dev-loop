name: Bug
description: Something in dev-loop does not work as its docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, with the exact error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or prompts, in order, from a clean state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dev-loop version
      description: The `version` in `dev-loop.json`.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and its version
      description: Claude Code or Codex, for example `Claude Code 2.1.0`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: check-setup
    attributes:
      label: check_setup.py output
      description: The output of `python3 .agents/skills/dev-loop/scripts/check_setup.py --harness claude|codex --repo .`.
      render: text
